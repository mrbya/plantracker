  <rect x="367" y="432" width="226" height="52" rx="26" fill="#cba6f7"/>

  <!-- Task bar 2: blue, 46% -->
  <rect x="367" y="499" width="290" height="52" rx="26" fill="#1e1e2e" opacity="0.55"/>
  <rect x="367" y="499" width="134" height="52" rx="26" fill="#89b4fa"/>

