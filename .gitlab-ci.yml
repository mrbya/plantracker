spec:
  inputs:
    build_docs:
      type: boolean
      default: false
      description: "Build project docs and deploy them to gitlab pages (manual web trigger only)"
---

image: registry.gitlab.com/family-treasure/plantracker/linux-build:latest

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: $[[ inputs.build_docs ]] == true

stages:
  - test
  - build
  - release
  - docs

variables:
  SQLX_OFFLINE: "true"

cache:
  key:
    files:
      - src-tauri/Cargo.lock
      - pnpm-lock.yaml
  paths:
    - ~/.cargo/registry/
    - ~/.cargo/git/
    - node_modules/

test:
  stage: test
  rules:
    - if: $[[ inputs.build_docs ]] == true
      when: never
    - when: on_success
  variables:
    SQLX_OFFLINE: "true"
    VITE_AZURE_CLIENT_ID: "test-client-id"
    VITE_AZURE_TENANT_ID: "test-tenant-id"
  script:
    - just ci-test
  coverage: '/^TOTAL\s+\S+\s+\S+\s+(\d+\.?\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 1 day

build:
  stage: build
  variables:
    VITE_AZURE_CLIENT_ID: $VITE_AZURE_CLIENT_ID
    VITE_AZURE_TENANT_ID: $VITE_AZURE_TENANT_ID
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - just ci-build
  artifacts:
    name: "platracker-$CI_COMMIT_SHORT_SHA"
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    expire_in: 7 days

upload-release:
  stage: release
  image: alpine:latest
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - apk add --no-cache curl
    - |
      PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/platracker/${CI_COMMIT_TAG}"
      LINKS_JSON=""
      for f in \
          src-tauri/target/release/bundle/deb/*.deb \
          src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe; do
        [ -f "$f" ] || continue
        filename=$(basename "$f")
        echo "Uploading ${filename}..."
        curl --fail \
             --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "$f" \
             "${PACKAGE_URL}/${filename}"
        [ -z "${LINKS_JSON}" ] || LINKS_JSON="${LINKS_JSON},"
        LINKS_JSON="${LINKS_JSON}{\"name\":\"${filename}\",\"url\":\"${PACKAGE_URL}/${filename}\"}"
      done
      echo "Creating release ${CI_COMMIT_TAG}..."
      curl --fail \
           --request POST \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --header "Content-Type: application/json" \
           --data "{\"name\":\"PlanTracker ${CI_COMMIT_TAG}\",\"tag_name\":\"${CI_COMMIT_TAG}\",\"assets\":{\"links\":[${LINKS_JSON}]}}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"

docs:
  stage: docs
  rules:
    - if: $[[ inputs.build_docs ]] == true
  script:
    - just check
    - just docs-ci
  artifacts:
    paths:
      - public

