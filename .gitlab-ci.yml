workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'

stages:
  - build
  - release

variables:
  SQLX_OFFLINE: "true"

cache:
  key:
    files:
      - src-tauri/Cargo.lock
      - pnpm-lock.yaml
  paths:
    - ~/.cargo/registry/
    - ~/.cargo/git/
    - node_modules/

linux-build:
  stage: build
  image: registry.gitlab.com/family-treasure/plantracker/linux-build:latest
  variables:
    VITE_AZURE_CLIENT_ID: $VITE_AZURE_CLIENT_ID
    VITE_AZURE_TENANT_ID: $VITE_AZURE_TENANT_ID
  script:
    - just ci-build
  artifacts:
    name: "platracker-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/appimage/*.AppImage
    expire_in: 7 days

windows-build:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: '$CI_COMMIT_TAG'
  variables:
    VITE_AZURE_CLIENT_ID: $VITE_AZURE_CLIENT_ID
    VITE_AZURE_TENANT_ID: $VITE_AZURE_TENANT_ID
  before_script:
    # Install Node.js via winget or choco (assumes chocolatey on runner)
    - choco install nodejs-lts -y
    - choco install pnpm -y
    # Install Rust stable
    - Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile rustup-init.exe
    - .\rustup-init.exe -y --default-toolchain stable
    - $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
    # Install Tauri CLI
    - cargo install tauri-cli --locked
    - cargo install sqlx-cli 
  script:
    - pnpm install --frozen-lockfile
    - cd src-tauri
    - cargo sqlx prepare --workspace --check
    - cd ..
    - cargo tauri build
  artifacts:
    name: "platracker-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - src-tauri/target/release/bundle/msi/*.msi
      - src-tauri/target/release/bundle/nsis/*.exe
    expire_in: 7 days

upload-release:
  stage: release
  image: alpine:latest
  needs:
    - job: linux-build
      artifacts: true
    - job: windows-build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - apk add --no-cache curl
    - |
      PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/platracker/${CI_COMMIT_TAG}"
      LINKS_JSON=""
      for f in \
          src-tauri/target/release/bundle/deb/*.deb \
          src-tauri/target/release/bundle/appimage/*.AppImage \
          src-tauri/target/release/bundle/nsis/*.exe; do
        [ -f "$f" ] || continue
        filename=$(basename "$f")
        echo "Uploading ${filename}..."
        curl --fail \
             --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "$f" \
             "${PACKAGE_URL}/${filename}"
        [ -z "${LINKS_JSON}" ] || LINKS_JSON="${LINKS_JSON},"
        LINKS_JSON="${LINKS_JSON}{\"name\":\"${filename}\",\"url\":\"${PACKAGE_URL}/${filename}\"}"
      done
      echo "Creating release ${CI_COMMIT_TAG}..."
      curl --fail \
           --request POST \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --header "Content-Type: application/json" \
           --data "{\"name\":\"PlanTracker ${CI_COMMIT_TAG}\",\"tag_name\":\"${CI_COMMIT_TAG}\",\"assets\":{\"links\":[${LINKS_JSON}]}}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
